# Reference reefer controller register map (pack format v1).
#
# Units are pinned per register and must match profiles/reefer.toml:
#   1 = degC, 7 = boolean (docs/unit-registry.md).
# Scaling: engineering_value = (raw * scale_mantissa * 10^scale_exponent)
#          + (offset_mantissa * 10^offset_exponent)
#
# The container temperature input is read-only; every commandable parameter is
# a holding register so the writable set equals the profile's parameters.
device_class = "reefer"

[[register]]
name = "container_temp_c"
register = 0
function = 4
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = false
quantity = 1

[[register]]
name = "ambient_c"
register = 1
function = 6
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = true
quantity = 1

[[register]]
name = "temperature_setpoint_c"
register = 2
function = 6
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = true
quantity = 1

[[register]]
name = "door_open"
register = 12
function = 6
data_type = "bool"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 7
writable = true
quantity = 1

[[register]]
name = "power_state"
register = 13
function = 6
data_type = "bool"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 7
writable = true
quantity = 1

[[register]]
name = "defrost_mode"
register = 14
function = 6
data_type = "bool"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 7
writable = true
quantity = 1

[[register]]
name = "compressor_on"
register = 15
function = 6
data_type = "bool"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 7
writable = true
quantity = 1
