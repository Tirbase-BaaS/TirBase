# Reference GDP room controller register map (pack format v1, CC-10).
#
# Units are pinned per register and must match the profiles:
#   1 = degC, 6 = percent, 7 = boolean (docs/unit-registry.md).
# Scaling: engineering_value = (raw * scale_mantissa * 10^scale_exponent)
#          + (offset_mantissa * 10^offset_exponent)
#
# Storage temperature and relative humidity are read-only monitoring inputs; the
# five writable registers are exactly the profile's commandable parameters.
device_class = "gdp_room"

[[register]]
name = "storage_temp_c"
register = 0
function = 4
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = false
quantity = 1

[[register]]
name = "relative_humidity_rh"
register = 1
function = 4
data_type = "u16"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 6
writable = false
quantity = 1

[[register]]
name = "temperature_setpoint_c"
register = 10
function = 6
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = true
quantity = 1

[[register]]
name = "humidity_setpoint_rh"
register = 11
function = 6
data_type = "u16"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 6
writable = true
quantity = 1

[[register]]
name = "door_open"
register = 20
function = 6
data_type = "bool"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 7
writable = true
quantity = 1

[[register]]
name = "defrost_mode"
register = 21
function = 6
data_type = "bool"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 7
writable = true
quantity = 1

[[register]]
name = "compressor_on"
register = 22
function = 6
data_type = "bool"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 7
writable = true
quantity = 1
