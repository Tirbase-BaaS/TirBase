safe_default = { mantissa = 30, exponent = 0, unit_id = 6 }
tightening_floor = { mantissa = 20, exponent = 0, unit_id = 6 }
critical = false
[parameters.kind]
type = "range"
min = { mantissa = 20, exponent = 0, unit_id = 6 }
max = { mantissa = 80, exponent = 0, unit_id = 6 }

