code = "GDP-REL-001"
blocked = false

[[release]]
id = "controlled_room_mkt_limit"
profile = "profiles/gdp_controlled_room.toml"
at_est = 1770000000
mkt_c = { mantissa = 255, exponent = -1, unit_id = 1 }
lane_risk_level = 1
