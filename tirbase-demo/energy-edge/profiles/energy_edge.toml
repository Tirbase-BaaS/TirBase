# Energy edge demo EnvelopeProfile (CLAIM-48.1, PV-16.2).
# Inverter/battery setpoints: power output and state-of-charge target.
profile_id = "e0e1e0e1-0000-0000-0000-000000000481"
version = 1
device_class = "energy_edge"
policy_loosen_m = 2
policy_loosen_n = 3
policy_timelock_secs = 3600
policy_cancel_window_secs = 600
# Committed test-fixture signature (PolicyAuthority seed [0x48; 32]).
signature_alg = "ed25519"
signature_hex = "9f70d4b19f8e1536457d2e6b8d4c0ce353a31363e8b6d4f4b9f6df8e2bf6d6b1f6e9f2c6f52f1e2c5f4f4e6e0ab4c7f6d4f0a2b1c3d4e5f60718293a4b5c60e"

[[parameters]]
name = "inverter_power_kw"
unit_id = 5          # kW
canonical_exponent = -1
max_rate_per_sec = { mantissa = 20, exponent = -1, unit_id = 5 } # 2.0 kW/s
dwell_secs = 10
min_off_secs = 0
drift_window_secs = 300
max_delta_in_window = { mantissa = 200, exponent = -1, unit_id = 5 } # 20.0 kW window
safe_default = { mantissa = 0, exponent = -1, unit_id = 5 }
tightening_floor = { mantissa = -1000, exponent = -1, unit_id = 5 }
critical = true
[parameters.kind]
type = "range"
min = { mantissa = -1000, exponent = -1, unit_id = 5 } # -100.0 kW (charge)
max = { mantissa = 1000, exponent = -1, unit_id = 5 }  # +100.0 kW (discharge)

[[parameters]]
name = "battery_soc_target_pct"
unit_id = 6          # percent
canonical_exponent = 0
