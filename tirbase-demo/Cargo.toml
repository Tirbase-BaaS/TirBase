[package]
name = "tirbase-demo"
version = "0.1.0"
edition = "2021"
description = "TirBase vertical demo packs (cold-chain, energy-edge, water, logistics, etc.)"
license = "MIT"

[dependencies]
tirbase-sim   = { workspace = true }
# tirbase-gateway is a binary crate; we depend on it as a lib
# by referencing the path directly rather than via workspace dep.
# When tirbase-gateway has a [lib] section, switch to workspace dep.
tirbase-types = { workspace = true }
