[package]
name = "tirbase-guard"
version = "0.1.0"
edition = "2021"
description = "Command Guard, envelope enforcement, policy lifecycle, and effects ledger"
license = "MIT"

[dependencies]
tirbase-types = { workspace = true }
tirbase-core  = { workspace = true }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
ciborium = "0.2"
# Lock-free config hot-swap for the target-to-profile map (CLAIM-10.5, PV-4.5).
arc-swap = "1"

[dev-dependencies]
# Property test for ratchet monotonicity (task 7.7, CLAIM-7.7).
proptest = "1.11.0"
# Async runtime for the two-CoreHandle enrollment integration test (task 8.6).
tokio = { version = "1", features = ["full"] }
serde_json = "1"
hex = "0.4"
# Compile-fail tests for ActuationPermit bypass-proof and negative derives
# (tasks 11.2/11.3, CLAIM-11.2/11.3, PV-4.3/PV-4.4).
trybuild = "1"

