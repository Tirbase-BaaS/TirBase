[package]
name = "tirbase-guard"
version = "0.1.0"
edition = "2021"
description = "Command Guard, envelope enforcement, policy lifecycle, and effects ledger"
license = "MIT"

[dependencies]
tirbase-types = { workspace = true }
tirbase-core  = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ciborium = "0.2"
# Lock-free config hot-swap for the target-to-profile map (CLAIM-10.5, PV-4.5).
arc-swap = "1"
zeroize = { version = "1.9", features = ["derive"] }

[features]
loom = ["dep:loom"]
shuttle = ["dep:shuttle"]

[dependencies.loom]
version = "0.7"
optional = true

[dependencies.shuttle]
version = "0.8"
optional = true

[dev-dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# Property test for ratchet monotonicity (task 7.7, CLAIM-7.7).
proptest = "1.11.0"
# Async runtime for the two-CoreHandle enrollment integration test (task 8.6).
tokio = { version = "1", features = ["full"] }
serde_json = "1"
hex = "0.4"
# Compile-fail tests for ActuationPermit bypass-proof and negative derives
# (tasks 11.2/11.3, CLAIM-11.2/11.3, PV-4.3/PV-4.4).
trybuild = "1"


[target.'cfg(unix)'.dependencies]
libc = "0.2"
tirbase-drivers = { workspace = true }

[dev-dependencies.tirbase-drivers]
path = "../tirbase-drivers"

[[bin]]
name = "driver-isolation-child"
path = "src/bin/driver_isolation_child.rs"
test = false
doc = false


[[bench]]
name = "guard_bench"
harness = false

[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[dev-dependencies.iai-callgrind]
version = "0.14"


[[bench]]
name = "guard_iai"
harness = false
