# Guard fuzz harness (CLAIM-40.1, PV-12.6): envelope/command untrusted parse paths.
[workspace]

[package]
name = "tirbase-guard-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
ciborium = "0.2"
tirbase-types = { path = "../../tirbase-types" }
tirbase-guard = { path = ".." }
tirbase-core = { path = "../../tirbase-core" }

[[bin]]
name = "envelope_profile_parse"
path = "fuzz_targets/envelope_profile_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_message_parse"
path = "fuzz_targets/command_message_parse.rs"
test = false
doc = false
bench = false
