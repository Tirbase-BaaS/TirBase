# Register map for the Acme TX-100 example thermostat.
#
# This file follows the TirBase Modbus register-map format
# (docs/drivers/register-map-format.md). The example driver uses it for
# parameter discovery, scaling, and framing decisions; it performs no I/O.

device_class = "acme_tx100_thermostat"

[[register]]
name = "temperature_c"
register = 0
function = 4
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = false
quantity = 1

[[register]]
name = "setpoint_c"
register = 1
function = 6
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = true
quantity = 1

[[register]]
name = "energy_kwh"
register = 2
function = 4
data_type = "u32"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "mid_little"
unit_id = 0
writable = false
quantity = 2
