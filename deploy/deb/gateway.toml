# Gateway configuration installed by the tirbase-gateway .deb ().
# State lives under /var/lib/tirbase; the admin socket under /run/tirbase.
# The device key file is generated by the gateway on first boot if absent.
key_path = "/var/lib/tirbase/device-key.json"
counter_db_path = "/var/lib/tirbase/primary.db"
derived_db_path = "/var/lib/tirbase/derived.db"
admin_socket = "/run/tirbase/admin.sock"
health_addr = "127.0.0.1:8080"
metrics_addr = "127.0.0.1:9090"
admin_enabled = true
log_level = "info"
