[package]
name = "tirbase-integrations"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "TirBase generic integration framework: connector trait, mapping DSL, retries, dead letters, auth and a mock vendor contract harness"
repository = "https://github.com/tirbase/tirbase"
keywords = ["integration", "connector", "webhook", "etl"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
hex = "0.4"
toml = "0.8"
zeroize = { version = "1.9", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
