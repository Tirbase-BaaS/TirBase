# Keep fuzz harness out of the root workspace (CLAIM-34.4 / cargo-fuzz convention).
[workspace]

[package]
name = "tirbase-drivers-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tirbase-drivers = { path = ".." }

[[bin]]
name = "modbus_frame"
path = "fuzz_targets/modbus_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mqtt_frame"
path = "fuzz_targets/mqtt_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "register_map_parse"
path = "fuzz_targets/register_map_parse.rs"
test = false
doc = false
bench = false
