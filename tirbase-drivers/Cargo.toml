[package]
name = "tirbase-drivers"
version = "0.1.0"
edition = "2021"
description = "Device driver framework and driver implementations for TirBase"
license = "AGPL-3.0-only"

[features]
default = []
# CC-04: BACnet/IP UDP read bridge. Off by default so the transport is only
# compiled where explicitly enabled; it adds no external dependencies.
bacnet-ip = []
# CC-06: native BLE central adapter on the same btleplug stack as the mesh
# bridge. Off by default so the pure probe boundary and simulator stay light.
ble-radio = ["dep:btleplug", "dep:tokio"]

[dependencies]
# STRICT: tirbase-drivers MUST NOT depend on tirbase-guard or tirbase-core (design.md §Dependency edges, PV-10.3, CLAIM-33.1/33.8)
tirbase-types      = { workspace = true }
tirbase-driver-api = { workspace = true }
# 34.2: real MQTT 3.1.1 bridge over rustls (external TLS deps allowed).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
# F-10: structured driver/adapter spans. Logging only; no guard/core import.
tracing = "0.1"
# CC-06: only linked by the `ble-radio` feature.
btleplug = { version = "0.11", optional = true, features = ["serde"] }
tokio = { version = "1", optional = true, features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs", "term"] }

[dev-dependencies]
tirbase-sim = { workspace = true }
rcgen = "0.13"
