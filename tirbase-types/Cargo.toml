[package]
name = "tirbase-types"
version = "0.1.0"
edition = "2021"
description = "no_std-capable core types for TirBase: FixedPointValue, ID newtypes, UnitId, CommandRole, DeviceSignature"
license = "Apache-2.0"
publish = false

[dependencies]
# `alloc` enables Serialize/Deserialize for String, Vec, Box, etc. in no_std contexts.
# `derive` enables the #[derive(Serialize, Deserialize)] macros.
# `std` is intentionally absent — this crate must compile on no_std targets.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# `libm` provides `powi`/`round` for `f64` in `no_std` (core `f64` lacks inherent math methods).
libm = "0.2"

[dev-dependencies]
serde_json = "1"
proptest   = "1.11.0"
