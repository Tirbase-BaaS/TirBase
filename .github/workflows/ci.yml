  sim-determinism-aarch64:
    name: sim determinism aarch64 (CLAIM-38.4/38.5)
    runs-on: ubuntu-24.04-arm
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-sim-determinism-${{ hashFiles('**/Cargo.lock') }}

      - name: Sim determinism digest (aarch64, PV-12.3)
        env:
          TIRBASE_SIM_DIGEST_OUT: ${{ runner.temp }}/sim-digest.txt
        run: |
          cargo test -p tirbase-sim --test determinism emit_cross_arch_digest -- --nocapture

      - name: Upload aarch64 sim digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-digest-aarch64
          path: ${{ runner.temp }}/sim-digest.txt
          if-no-files-found: error
          retention-days: 7

  sim-determinism:
    name: sim determinism compare (x86_64 vs aarch64, CLAIM-38.4/38.5)
    runs-on: ubuntu-latest
    needs: [sim-determinism-x86_64, sim-determinism-aarch64]
    steps:
      - name: Download x86_64 sim digest
        uses: actions/download-artifact@v4
        with:
          name: sim-digest-x86_64
          path: digests/sim-x86_64

      - name: Download aarch64 sim digest
        uses: actions/download-artifact@v4
        with:
          name: sim-digest-aarch64
          path: digests/sim-aarch64

      - name: Compare x86_64 and aarch64 simulator digests
        run: |
          set -euo pipefail
          host_digest=digests/sim-x86_64/sim-digest.txt
          arm_digest=digests/sim-aarch64/sim-digest.txt
          test -s "$host_digest" || { echo "missing x86_64 sim digest artifact"; exit 1; }
          test -s "$arm_digest" || { echo "missing aarch64 sim digest artifact"; exit 1; }
          echo "x86_64:  $(cat "$host_digest")"
          echo "aarch64: $(cat "$arm_digest")"
          diff -u "$host_digest" "$arm_digest" || {
            echo "MISMATCH: thermal/battery/scenario output differs between x86_64 and aarch64";
            exit 1;
          }
          echo "OK: x86_64 and aarch64 produced bit-identical simulator output"

  # ── Packaging and fleet inventory (task 37, PV-11.3/PV-11.4) ───────────────
  #
  # These jobs are the production callers for CLAIM-37.1 … CLAIM-37.4.  They
  # build the gateway for the two ARM targets, produce a Debian 11 package and a
  # container image, and gate binary size / RSS against deploy/budgets.toml.

  cross-compile:
    name: cross-compile ${{ matrix.target }} (CLAIM-37.1)
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            elf_machine: AArch64
          - target: armv7-unknown-linux-gnueabihf
            elf_machine: ARM
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        # Cross.toml supplies the per-target libdbus pre-build hook.
        run: |
          if ! command -v cross &>/dev/null; then
            cargo install cross --locked
          fi

      - name: Build tirbase-gateway for ${{ matrix.target }}
        run: cross build --release --locked -p tirbase-gateway --target ${{ matrix.target }}

      - name: Verify the produced binary is a ${{ matrix.target }} ELF
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/tirbase-gateway"
          test -f "$BIN" || { echo "ERROR: missing cross-compiled binary $BIN"; exit 1; }
          test -x "$BIN" || { echo "ERROR: $BIN is not executable"; exit 1; }
          file "$BIN"
          MACHINE="$(readelf -h "$BIN" | awk -F: '/Machine:/{gsub(/^[ \t]+/, "", $2); print $2}')"
          case "$MACHINE" in
            *"${{ matrix.elf_machine }}"*) ;;
            *) echo "ERROR: expected ELF machine '${{ matrix.elf_machine }}', got '$MACHINE'"; exit 1 ;;
          esac
          SIZE=$(wc -c < "$BIN")
          test "$SIZE" -gt 1000000 || { echo "ERROR: implausibly small binary ($SIZE bytes)"; exit 1; }
          echo "OK: $BIN is a $MACHINE executable ($SIZE bytes)"

      - name: Execute the cross-compiled binary (${{ matrix.target }})
        # `cross run` executes the binary under the target qemu-user inside the
        # cross image, proving the artifact actually starts on the target ABI.
        run: |
          set -euo pipefail
          OUT=$(cross run --release --locked -p tirbase-gateway --target ${{ matrix.target }} -- --version)
          echo "$OUT"
          case "$OUT" in
            *"tirbase-gateway"*) ;;
            *) echo "ERROR: cross-compiled binary did not report its version"; exit 1 ;;
          esac

      - name: Binary size budget gate (CLAIM-37.4)
        run: bash scripts/check-size-budget.sh binary-size "target/${{ matrix.target }}/release/tirbase-gateway" "${{ matrix.target }}"

      - name: Upload cross-compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/tirbase-gateway
          retention-days: 7

  package-deb:
    name: .deb package + Debian 11 install test (CLAIM-37.2)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-package-deb-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        run: |
          if ! command -v cross &>/dev/null; then
            cargo install cross --locked
          fi

      - name: Build the glibc-2.31 x86_64 release binary
        # Debian 11 ships glibc 2.31; cross's x86_64 image links against it so
        # the package is installable on the oldest supported target.
        run: cross build --release --locked -p tirbase-gateway --target x86_64-unknown-linux-gnu

      - name: Install cargo-deb
        run: |
          if ! command -v cargo-deb &>/dev/null; then
            cargo install cargo-deb --locked
          fi

      - name: Build the .deb
        # Asset and maintainer-script paths in [package.metadata.deb] resolve
        # against the workspace root (cargo-deb 3.x does not chdir).
        run: cargo deb -p tirbase-gateway --target x86_64-unknown-linux-gnu --no-build --output target/debian/

      - name: Inspect the package payload
        run: |
          set -euo pipefail
          # shellcheck disable=SC2012 # the glob is single-package and controlled
          DEB="$(ls target/debian/tirbase-gateway_*.deb | head -1)"
          test -n "$DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | grep -q 'usr/bin/tirbase-gateway'
          dpkg-deb -c "$DEB" | grep -q 'lib/systemd/system/tirbase-gateway.service'
          dpkg-deb -c "$DEB" | grep -q 'etc/tirbase/gateway.toml'
          echo "package architecture: $(dpkg-deb -f "$DEB" Architecture)"

      - name: Install and start the gateway on Debian 11 (integration test)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/target/debian:/pkg:ro" debian:11 bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl >/dev/null
            apt-get install -y -qq /pkg/tirbase-gateway_*.deb >/dev/null
            dpkg -s tirbase-gateway | grep -E "^(Version|Architecture)"
            /usr/bin/tirbase-gateway --version
            install -d -m 0750 /var/lib/tirbase /run/tirbase
            /usr/bin/tirbase-gateway /etc/tirbase/gateway.toml >/tmp/gateway.log 2>&1 &
            PID=$!
            healthy=0
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 1
            done
            kill "$PID" >/dev/null 2>&1 || true
            wait "$PID" 2>/dev/null || true
            if [ "$healthy" != 1 ]; then
              echo "ERROR: gateway did not pass /health after .deb install"
              cat /tmp/gateway.log
              exit 1
            fi
            echo "OK: .deb installed and gateway passed /health on Debian 11"
          '

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: tirbase-gateway-deb
          path: target/debian/tirbase-gateway_*.deb
          retention-days: 7

  package-oci:
    name: OCI image + health check (CLAIM-37.3)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-package-oci-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        run: |
          if ! command -v cross &>/dev/null; then
            cargo install cross --locked
          fi

      - name: Build the glibc-2.31 x86_64 release binary
        run: cross build --release --locked -p tirbase-gateway --target x86_64-unknown-linux-gnu

      - name: Stage the Docker build context
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/tirbase-gateway dist/tirbase-gateway

      - name: Build the OCI image
        run: docker build -f deploy/Dockerfile -t tirbase-gateway:ci .

      - name: Inspect the built image
        run: |
          docker image inspect tirbase-gateway:ci \
            --format 'architecture={{.Architecture}} os={{.Os}}'
          ARCH="$(docker image inspect tirbase-gateway:ci --format '{{.Architecture}}')"
          test "$ARCH" = "amd64" || { echo "ERROR: unexpected image architecture $ARCH"; exit 1; }
          docker image inspect tirbase-gateway:ci --format '{{json .Config.Healthcheck}}' | grep -q 'curl' \
            || { echo "ERROR: image has no HEALTHCHECK"; exit 1; }

      - name: Run the image and wait for the health check (integration test)
        run: |
          set -euo pipefail
          docker run -d --name tirbase-gateway-ci tirbase-gateway:ci
          status=""
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tirbase-gateway-ci)"
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          echo "container health: $status"
          docker logs tirbase-gateway-ci || true
          docker rm -f tirbase-gateway-ci >/dev/null 2>&1 || true
          if [ "$status" != "healthy" ]; then
            echo "ERROR: OCI image did not pass its health check (status=$status)"
            exit 1
          fi
          echo "OK: OCI image started and passed the health check"

  size-budget:
    name: binary size + RSS budget gates (CLAIM-37.4)
    runs-on: ubuntu-latest
    needs: [cross-compile]
    steps:
      - uses: actions/checkout@v4

      - name: Download the x86_64 cross-compiled gateway
        uses: actions/download-artifact@v4
        with:
          name: gateway-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release

      - name: Prove the gate fails on an over-budget size or RSS measurement
        # Self-test uses synthetic budgets; it does not touch deploy/budgets.toml.
        run: bash scripts/check-size-budget.sh --self-test

      - name: Binary size budget gate
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/tirbase-gateway
          chmod +x "$BIN"
          bash scripts/check-size-budget.sh binary-size "$BIN" x86_64-unknown-linux-gnu

      - name: Boot the gateway and gate peak RSS
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-gnu/release/tirbase-gateway
          chmod +x "$BIN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libdbus-1-3 curl
          WORK="$RUNNER_TEMP/tirbase-rss"
          mkdir -p "$WORK"
          cat > "$WORK/gateway.toml" <<EOF
          key_path = "$WORK/device-key.json"
          counter_db_path = "$WORK/primary.db"
          derived_db_path = "$WORK/derived.db"
          admin_socket = "$WORK/admin.sock"
          health_addr = "127.0.0.1:18080"
          metrics_addr = "127.0.0.1:19090"
          admin_enabled = false
          checkpoint_interval_secs = 3600
          EOF
          "$BIN" "$WORK/gateway.toml" >"$WORK/gateway.log" 2>&1 &
          PID=$!
          healthy=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            echo "ERROR: gateway did not become healthy for the RSS measurement"
            cat "$WORK/gateway.log"
            kill "$PID" >/dev/null 2>&1 || true
            exit 1
          fi
          PEAK_KIB="$(awk '/^VmHWM:/ {print $2}' "/proc/$PID/status")"
          kill "$PID" >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          test -n "$PEAK_KIB" || { echo "ERROR: could not read VmHWM"; exit 1; }
          bash scripts/check-size-budget.sh rss "$PEAK_KIB"

  vertical-demo-packs:
    name: vertical demo packs (CLAIM-48.1..48.6)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-demo-packs-${{ hashFiles('**/Cargo.lock') }}

      - name: Run vertical demo pack integration tests (CLAIM-48.1..48.6)
        run: cargo test -p tirbase-demo --test vertical_demo_packs -- --nocapture --test-threads=1

      - name: Run demo pack entry scripts (observable defended output)
        run: |
          set -euo pipefail
          for pack in energy-edge water-pumping logistics-node buildings-bms remote-ops-mesh defense-logistics; do
            echo "--- running tirbase-demo/${pack}/run.sh ---"
            bash "tirbase-demo/${pack}/run.sh"
          done

  gateway-sdk-generated:
    name: gateway admin TypeScript SDK generated from OpenAPI (CLAIM-49.1, CLAIM-49.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate SDK and reject manual changes
        run: bash scripts/check-gateway-sdk-generated.sh

  gateway-admin-sdk-e2e:
    name: gateway admin TypeScript SDK e2e (real binary over mTLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gateway-sdk-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gateway binary
        run: cargo build -p tirbase-gateway --bin tirbase-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund

      # The test boots the real gateway with the mTLS remote admin listener
      # enabled, mints a token over the local admin socket, and drives every
      # ADMIN_PATHS/OPERATION_IDS entry through the generated client. The PKI,
      # trust root and signed simulate command come from
      # tirbase-gateway/examples/admin_e2e_setup.rs.
      - name: Run gateway admin SDK e2e
        working-directory: sdk/typescript
        env:
          TIRBASE_GATEWAY_BIN: ${{ github.workspace }}/target/debug/tirbase-gateway
        run: npm test

  wasm-public-api-diff:
    name: WASM exports diff against cargo public-api (CLAIM-49.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly (cargo-public-api)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack (best-effort export inventory)
        run: |
          if ! command -v wasm-pack &>/dev/null; then
            cargo install wasm-pack --locked
          fi

      - name: Install cargo-public-api
        run: |
          if ! cargo +nightly public-api --help &>/dev/null; then
            cargo +nightly install cargo-public-api --locked
          fi

      - name: Diff WASM/public API surface against baseline
        run: bash scripts/check-wasm-public-api.sh

  mdbook-site:
    name: mdBook documentation site (CLAIM-50.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          if ! command -v mdbook &>/dev/null; then
            cargo install mdbook --locked
          fi

      - name: Build mdBook site
        run: mdbook build docs

  readme-status:
    name: regenerate README Status from CLAIMS.md (CLAIM-50.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate README Status section
        run: python3 scripts/generate-readme-status.py

      - name: Fail if README Status is out of date
        run: |
          if ! git diff --quiet -- README.md; then
            echo "ERROR: README Status section differs from CLAIMS.md-generated output."
            git --no-pager diff -- README.md
            exit 1
          fi
          echo "OK: README Status section matches CLAIMS.md."

  formal-models:
    name: TLA+ model check (CLAIM-51.1–51.4, PV-26.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download TLA+ tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.1/tla2tools.jar

      - name: Model-check every spec with TLC
        run: bash scripts/check-formal-models.sh "$RUNNER_TEMP/tla2tools.jar"

  concurrency-models:
    name: loom/shuttle concurrency models (CLAIM-51.5, PV-26.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: loom model check (real SingleWriterLease / AntiReplayWindow)
        run: cargo test -p tirbase-guard --features loom --test concurrency_loom

      - name: shuttle schedule check (real SingleWriterLease / AntiReplayWindow)
        run: cargo test -p tirbase-guard --features shuttle --test concurrency_shuttle

  kani-envelope-arith:
    name: Kani overflow proof (CLAIM-51.6, PV-26.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Kani has no preinstalled runner here; install it explicitly and let a
      # failure to install fail the job (never a silent pass).
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      # Single-file Kani harness. It models the guard's i128 comparison; it does
      # not yet link `tirbase-types`, so CLAIM-51.6 stays Planned until the
      # harness is moved onto the real type and observed green.
      - name: Run the envelope-arithmetic proof harnesses
        run: kani formal/kani_envelope_arith.rs
