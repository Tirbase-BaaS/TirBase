      - name: Instruction-count gate (tirbase-core)
        run: bash scripts/check-iai-regression.sh tirbase-core tirbase-core/iai-baseline.txt

  memory-budget-check:
    name: memory budget measurement gate (24.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Load configured caches and assert peak RSS stays under the budget
        run: cargo test -p tirbase-core --test memory_budget_gate -- --ignored --nocapture


  # Both legs are native: cross-compiling to aarch64 and running the libtest
  # binary under qemu-user hangs on a trivial `assert_eq!(1, 1)` test (libtest's
  # worker threads deadlock under emulation), so emulation is not a usable
  # signal. The aarch64 leg runs on GitHub's arm64 hosted runner instead.
  cross-arch-migration-determinism-x86_64:
    name: migration determinism x86_64 (CLAIM-29.6)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-migration-xarch-${{ hashFiles('**/Cargo.lock') }}

      # Executes the committed conformance corpus and asserts the digest equals
      # the committed known-good digest; emits the digest for the compare job.
      - name: Migration conformance digest (x86_64, PV-8/CLAIM-29.6)
        env:
          TIRBASE_MIGRATION_DIGEST_OUT: ${{ runner.temp }}/migration-digest.txt
        run: |
          cargo test -p tirbase-core --lib migration::wasm_sandbox::tests::deterministic_cross_arch_hash_vector -- --nocapture

      - name: Upload x86_64 digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-digest-x86_64
          path: ${{ runner.temp }}/migration-digest.txt
          if-no-files-found: error
          retention-days: 7

  cross-arch-migration-determinism-aarch64:
    name: migration determinism aarch64 (CLAIM-29.6)
    runs-on: ubuntu-24.04-arm
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-migration-xarch-${{ hashFiles('**/Cargo.lock') }}

      - name: Migration conformance digest (aarch64, PV-8/CLAIM-29.6)
        env:
          TIRBASE_MIGRATION_DIGEST_OUT: ${{ runner.temp }}/migration-digest.txt
        run: |
          cargo test -p tirbase-core --lib migration::wasm_sandbox::tests::deterministic_cross_arch_hash_vector -- --nocapture

      - name: Upload aarch64 digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-digest-aarch64
          path: ${{ runner.temp }}/migration-digest.txt
          if-no-files-found: error
          retention-days: 7

  cross-arch-migration-determinism:
    name: migration determinism compare (x86_64 vs aarch64, CLAIM-29.6)
    runs-on: ubuntu-latest
    needs: [cross-arch-migration-determinism-x86_64, cross-arch-migration-determinism-aarch64]
    steps:
      - name: Download x86_64 digest
        uses: actions/download-artifact@v4
        with:
          name: migration-digest-x86_64
          path: digests/x86_64

      - name: Download aarch64 digest
        uses: actions/download-artifact@v4
        with:
          name: migration-digest-aarch64
          path: digests/aarch64

      - name: Compare x86_64 and aarch64 migration output digests
        run: |
          set -euo pipefail
          host_digest=digests/x86_64/migration-digest.txt
          arm_digest=digests/aarch64/migration-digest.txt
          test -s "$host_digest" || { echo "missing x86_64 digest artifact"; exit 1; }
          test -s "$arm_digest" || { echo "missing aarch64 digest artifact"; exit 1; }
          echo "x86_64:  $(cat "$host_digest")"
          echo "aarch64: $(cat "$arm_digest")"
          diff -u "$host_digest" "$arm_digest" || {
            echo "MISMATCH: migration output digests differ between x86_64 and aarch64";
            exit 1;
          }
          echo "OK: x86_64 and aarch64 produced the same migration output digest"

  # Bit-identical model determinism across architectures (CLAIM-38.4/38.5,
