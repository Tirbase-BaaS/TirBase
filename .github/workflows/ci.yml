      - name: Smoke test envelope_profile_parse (<=60s)
        working-directory: tirbase-guard
        run: cargo +nightly fuzz run envelope_profile_parse -- -max_total_time=55 -runs=1000000
      - name: Smoke test command_message_parse (<=60s)
        working-directory: tirbase-guard
        run: cargo +nightly fuzz run command_message_parse -- -max_total_time=55 -runs=1000000

  fuzz-target-registry:
    name: fuzz target registry rule (CLAIM-40.1, PV-6.8, PV-12.6)
    runs-on: ubuntu-latest
