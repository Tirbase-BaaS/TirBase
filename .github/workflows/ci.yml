  cargo-mutants-gate:
    name: cargo-mutants kill-rate gate (CLAIM-40.2, PV-12.7)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-mutants-gate-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-mutants
        run: |
          if ! command -v cargo-mutants &>/dev/null; then
            cargo install cargo-mutants --locked
          fi
      - name: Enforce >=80% mutation kill rate on guard/ledger/replay/validation modules
        run: python3 scripts/check-mutants-threshold.sh --timeout 120
      - name: Upload mutants gate artifact
