[workspace]
members = [
    "tirbase-types",
    "tirbase-core",
    "tirbase-guard",
    "tirbase-driver-api",
    "tirbase-drivers",
    "tirbase-gateway",
    "tirbase-admin",
    "tirbase-sim",
    "tirbase-demo",
    "tirbase-epcis",
    "tirbase-pos",
    "tirbase-notify",
    "tirbase-integrations",
    "tirbase-en16931",
    "tirbase-venue",
    "tirbase-venue-gateway",
    "tirbase-venue-access",
    "tirbase-venue-gate",
    "tirbase-venue-ticket",
    "tirbase-venue-capacity",
    "tirbase-venue-admission",
    "tirbase-venue-lockdown",
    "tirbase-venue-scenarios",
    "tirbase-venue-scenario-runner",
    "tirbase-venue-connectors",
    "tirbase-venue-command-center",
    "tirbase-venue-hil",
    "tirbase-venue-privacy",
    "examples/vendor-driver",
]
resolver = "2"

[workspace.dependencies]
fail = "0.5"
tirbase-types   = { path = "tirbase-types" }
tirbase-core       = { path = "tirbase-core" }
tirbase-guard      = { path = "tirbase-guard" }
tirbase-driver-api = { path = "tirbase-driver-api" }
tirbase-drivers    = { path = "tirbase-drivers" }
tirbase-gateway = { path = "tirbase-gateway" }
tirbase-sim     = { path = "tirbase-sim" }
tirbase-pos     = { path = "tirbase-pos" }
tirbase-venue   = { path = "tirbase-venue" }
tirbase-venue-gateway = { path = "tirbase-venue-gateway" }
tirbase-venue-access = { path = "tirbase-venue-access" }
tirbase-venue-gate = { path = "tirbase-venue-gate" }
tirbase-venue-ticket = { path = "tirbase-venue-ticket" }
tirbase-venue-capacity = { path = "tirbase-venue-capacity" }
tirbase-venue-admission = { path = "tirbase-venue-admission" }
tirbase-venue-lockdown = { path = "tirbase-venue-lockdown" }
tirbase-venue-scenarios = { path = "tirbase-venue-scenarios" }
tirbase-integrations = { path = "tirbase-integrations" }
tirbase-venue-scenario-runner = { path = "tirbase-venue-scenario-runner" }
tirbase-venue-connectors = { path = "tirbase-venue-connectors" }
tirbase-venue-command-center = { path = "tirbase-venue-command-center" }
tirbase-venue-hil = { path = "tirbase-venue-hil" }
tirbase-venue-privacy = { path = "tirbase-venue-privacy" }
# Apache-2.0 data-only pack framework; consumed by gateway pack tests.
tirbase-demo    = { path = "tirbase-demo" }
# Apache-2.0 alert connectors; the AGPL gateway delivers through them (CC-17).
tirbase-notify  = { path = "tirbase-notify" }
