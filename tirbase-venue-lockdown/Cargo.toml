[package]
name = "tirbase-venue-lockdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
publish = false
description = "Venue lockdown and M-of-N command overrides: signed venue/zone lockdown, fail-safe gate posture, break-glass, capacity overrides, distinct approvers, audit and security events (ST-08)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tirbase-venue = { workspace = true }
tirbase-venue-ticket = { workspace = true }
tirbase-venue-capacity = { workspace = true }
hex = "0.4"
