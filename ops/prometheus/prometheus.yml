#
# Reference scrape configuration for F-10. The gateway binds metrics to
# 127.0.0.1:9090 by design; run Prometheus on the same host (or use an
# authenticated loopback proxy) and do not expose the endpoint publicly.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tirbase
    environment: production

rule_files:
  - /etc/tirbase/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: tirbase-gateway
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: tirbase-gateway
          component: gateway

  - job_name: tirbase-canary
    static_configs:
      - targets: ["127.0.0.1:9101"]
        labels:
          service: tirbase-canary
          component: synthetic
