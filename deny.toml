# cargo-deny configuration for TriBase
# Enforces license compliance, bans problematic crates, and blocks known
# advisories. This file is the gate checked by the CI "cargo-deny check" step.
#
# ADVISORY IGNORES: The entries in [advisories].ignore below document security
# issues that existed in the dependency tree when this gate was first wired.
# They must be resolved by upgrading the affected crates. Each entry carries
# the advisory ID and the reason it was not immediately fixed (upstream
# dependency constraint, no compatible patch release, etc.).
#
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluate the full dependency graph.
targets = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# v2: all licenses are denied unless explicitly listed in `allow`. The old
# `unlicensed`, `copyleft`, `deny` top-level keys are removed in v2.
version = 2

# Allow-listed SPDX expressions (all that appear in the current dep tree).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",   # cranelift / wasmtime / rustix / wasm-* crates
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",                       # ICU / zerovec / yoke family
    "Unicode-DFS-2016",
    "MPL-2.0",                           # attohttpc — file-level copyleft, explicitly approved
]

# r-efi ships "MIT OR Apache-2.0 OR LGPL-2.1-or-later".
# We accept it under the MIT OR Apache-2.0 branch. LGPL-2.1-or-later must be
# listed so cargo-deny can resolve the expression.
[[licenses.exceptions]]
crate = "r-efi"
allow = ["MIT", "Apache-2.0", "LGPL-2.1-or-later"]

# ring ships a custom multi-file license (MIT AND ISC AND OpenSSL).
# cargo-deny needs a clarify stanza to parse its non-standard LICENSE file.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Warn (not error) on multiple versions of the same crate to avoid
# spurious CI breaks during routine upgrades, while still surfacing drift.
multiple-versions = "warn"

# Explicitly banned crates — prefer pure-Rust alternatives already in tree.
deny = [
    # openssl: use rustls / ring (already in tree) instead.
    { name = "openssl" },
    { name = "openssl-sys" },
    # native-tls: pulls in openssl on Linux; rustls is the project standard.
    { name = "native-tls" },
]

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
# version = 2: all vulnerability/unsound advisories are always errors unless
# individually ignored below with a documented reason.
version = 2

# Unmaintained advisories for direct workspace dependencies fail CI.
# Transitive-only unmaintained deps emit a warning rather than failing.
unmaintained = "workspace"

# Block yanked crate versions.
yanked = "deny"

# --- Pre-existing advisories at gate-wiring time (2026-11-07) ---------------
# These issues existed before the cargo-deny gate was added. Each must be
# resolved by upgrading the affected crate or its parent. Remove entries here
# as the upstream fixes land.
ignore = [
    # crypto-bigint v0.5.5 — timing variability in constant-time operations.
    # Used transitively via biscuit-auth → elliptic-curve. Awaiting biscuit-auth
    # upgrade to elliptic-curve ≥ 0.14 / crypto-bigint ≥ 0.5.6.
    { id = "RUSTSEC-2026-0387", reason = "pre-existing; upgrade blocked by biscuit-auth@6 pinning elliptic-curve@0.13" },

    # hickory-proto v0.25.2 — two DNS parsing issues pulled in by libp2p-mdns.
    { id = "RUSTSEC-2026-0118", reason = "pre-existing; upgrade blocked by libp2p@0.56 pinning hickory-proto@0.25" },
    { id = "RUSTSEC-2026-0119", reason = "pre-existing; upgrade blocked by libp2p@0.56 pinning hickory-proto@0.25" },

    # tokio v1.53.1 — AsyncFd constructors violate I/O safety (unsound).
    # Will be resolved when tokio publishes a patched 1.x release.
    { id = "RUSTSEC-2026-0386", reason = "pre-existing; awaiting tokio patch release for AsyncFd I/O safety" },

    # wasmtime — multiple component-model and JIT vulnerabilities in v48.x.
    # All require upgrading to the patched wasmtime release when available.
    { id = "RUSTSEC-2026-0315", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0316", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0325", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0326", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0327", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0353", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0354", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0355", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0356", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
    { id = "RUSTSEC-2026-0357", reason = "pre-existing wasmtime vuln; upgrade wasmtime when patched release is available" },
