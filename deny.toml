# cargo-deny configuration for TriBase
# Enforces license compliance, bans problematic crates, and blocks known
# advisories. This file is the gate checked by the CI "cargo-deny check" step.
#
# SUPPLY CHAIN: All crates are fetched through the local Kellnr proxy registry
# (see .cargo/config.toml). Kellnr caches and serves crates from crates.io
# with checksum verification. The [sources] block below allows both the
# crates.io index (used by cargo-deny's graph analysis) and the Kellnr source
# (used by Cargo's actual downloads).
#
# KELLNR: Start with `docker compose -f .kellnr/docker-compose.yml up -d`
#
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
version = 2

allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    # Mozilla CA root store data used by webpki-roots (rustls trust anchors).
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]

[[licenses.exceptions]]
crate = "r-efi"
allow = ["MIT", "Apache-2.0", "LGPL-2.1-or-later"]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"

deny = [
    # openssl: use rustls / ring (already in tree) instead.
    { name = "openssl" },
    { name = "openssl-sys" },
    # native-tls: pulls in openssl on Linux; rustls is the project standard.
    { name = "native-tls" },
]

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"

ignore = [
    { id = "RUSTSEC-2026-0387", reason = "pre-existing; upgrade blocked by biscuit-auth@6 pinning elliptic-curve@0.13" },
    { id = "RUSTSEC-2026-0118", reason = "pre-existing; upgrade blocked by libp2p@0.56 pinning hickory-proto@0.25" },
    { id = "RUSTSEC-2026-0119", reason = "pre-existing; upgrade blocked by libp2p@0.56 pinning hickory-proto@0.25" },
    { id = "RUSTSEC-2026-0386", reason = "pre-existing; awaiting tokio patch release for AsyncFd I/O safety" },
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
# Allow the standard crates.io index (used by cargo-deny's own graph analysis)
# and the Kellnr registry (used by Cargo's actual downloads via source
# replacement in .cargo/config.toml).
#
# cargo-deny evaluates the graph against the crates.io index regardless of
# source replacement, so "https://github.com/rust-lang/crates.io-index" must
# always be listed. The Kellnr URL is also listed so that cargo-deny does not
# reject the source entry when run against a fresh checkout that hasn't had
# Cargo.lock rewritten yet.
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = [
    # Standard crates.io sparse index (primary source of truth for cargo-deny)
    "https://github.com/rust-lang/crates.io-index",

]
