[features]
# Default: plain bundled SQLite. `sqlcipher` replaces `bundled` with
# `bundled-sqlcipher` (mutually exclusive; CLAIM-32.5, PV-9.6).
default = ["sqlite"]
sqlite = ["rusqlite/bundled"]
sqlcipher = ["rusqlite/bundled-sqlcipher"]
# Hardware-backed key providers and counters are feature-gated (tasks 6.3,
# 6.4, 6.6).  Both stubs compile without their SDKs present.
tpm2 = []
pkcs11 = []
# Failpoint injection for PV-9.3/CLAIM-32.2 power-loss boundary tests.
failpoints = ["tirbase-core/failpoints"]
# Test utilities exported for integration tests (CountingNotifier etc.).
test-util = []

[package]
name = "tirbase-gateway"
version = "0.1.0"
edition = "2021"
description = "TirBase hardened edge gateway binary"
license = "MIT"

[[bin]]
name = "tirbase-gateway"
path = "src/main.rs"

# Debian package metadata (task 37.2, PV-11.4).  The packaging CI job runs
# `cargo deb -p tirbase-gateway` from the WORKSPACE ROOT so the asset and
# maintainer-script paths below resolve against the repository root (cargo-deb
# 3.x does not chdir to the package directory).
[package.metadata.deb]
maintainer = "TirBase Maintainers <maintainers@tirbase.local>"
copyright = "2026, TirBase Contributors"
section = "net"
priority = "optional"
# Explicit runtime dependencies keep the package installable on Debian 11:
# glibc 2.31 is the Debian 11 baseline and the CI build links against it.
depends = "libc6 (>= 2.31), libgcc-s1, libdbus-1-3"
extended-description = """
TirBase hardened edge gateway. Runs the deny-all command guard, the local
admin API on a peer-credential-authenticated Unix socket, the Prometheus
metrics endpoint and the /health liveness endpoint (PV-11.1, PV-11.2).
"""
maintainer-scripts = "deploy/deb"
assets = [
    ["target/release/tirbase-gateway", "usr/bin/tirbase-gateway", "755"],
    ["deploy/systemd/tirbase-gateway.service", "lib/systemd/system/tirbase-gateway.service", "644"],
    ["deploy/systemd/tirbase-guard.service", "lib/systemd/system/tirbase-guard.service", "644"],
    ["deploy/systemd/tirbase-lockdown.service", "lib/systemd/system/tirbase-lockdown.service", "644"],
    ["deploy/deb/gateway.toml", "etc/tirbase/gateway.toml", "640"],
]

[dependencies]
tirbase-types   = { workspace = true }
tirbase-core    = { workspace = true }
tirbase-guard   = { workspace = true }
tirbase-drivers = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait definitions (KeyProvider::sign_async)
async-trait = "0.1"

# TOML config parsing
toml = "0.8"

# Serialisation / deserialization for GatewayConfig
serde = { version = "1", features = ["derive"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling in the binary
anyhow = "1"

# SO_PEERCRED peer-credential access (Linux-only admin socket authentication)
# Only linked on Linux; listed unconditionally so `cargo check` resolves it on
# all platforms — the actual unsafe call is #[cfg(target_os = "linux")].
libc = "0.2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP server for health endpoint (PV-30.3 / CLAIM-4.9.3)
axum = "0.7"

# JSON body serialisation (used by health endpoint)
serde_json = "1"
wat = "1"
# `default-features = false` so `sqlcipher` can replace `bundled` (PV-9.6).
rusqlite = { version = "0.40", default-features = false, features = [] }

# Hash-chained security event log (PV-7.2/7.3, task 25).
sha2 = "0.11.0"
ciborium = "0.2"

# Secret-typed private material (PKCS#11 PIN, key seeds) and zeroize-on-drop
# assertions for key-material structs.
secrecy = { version = "0.8" }
zeroize = { version = "1.9", features = ["derive"] }

# Hex decoding for TimeAnchor public keys in the beacon trust file (task 7.4).
hex = "0.4"
rustls-pemfile = "2"
# Task 36.2 remote admin mTLS and task 36.8 outbound cloud TLS.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
getrandom = "0.2"
arc-swap = "1"

# Failpoint injection for kill-at-every-step ledger tests (PV-5.4, 19.6).
fail = { workspace = true }


[dev-dependencies]
# HTTP client for health endpoint integration test
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
proptest = "1.5"
# TimeRatchet / TimeBeacon integration tests (task 7): build and sign beacon
# envelopes with the real guard and identity crates.
tirbase-core  = { workspace = true }
tirbase-guard = { workspace = true }
tirbase-types = { workspace = true }
tirbase-sim   = { workspace = true }
tirbase-drivers = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde_json = "1"
wat = "1"
rcgen = "0.13"
