[package]
name = "tirbase-venue-connectors"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
publish = false
description = "Apache-2.0 venue connector framework: ticketing, access, BMS, CCTV and PA interfaces, event schemas, mapping, idempotency, retries, dead letters, signed webhooks, mocks, conformance suite and venue privacy rules (ST-10)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
hex = "0.4"
toml = "0.8"
tirbase-integrations = { workspace = true }
