[package]
name = "tirbase-sim"
version = "0.1.0"
edition = "2021"
description = "Seeded deterministic adversary simulator for TirBase"
license = "AGPL-3.0-only"

[dependencies]
tirbase-types   = { workspace = true }
tirbase-core    = { workspace = true }
tirbase-guard   = { workspace = true }
tirbase-drivers = { workspace = true }
automerge       = { version = "0.11.0", default-features = false }
rusqlite        = { version = "0.40", features = ["bundled"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
# Deterministic PRNG (PV-12.1, CLAIM-38.1). ChaCha8Rng is bit-identical across
# platforms and crate versions (unlike SmallRng/thread_rng).
rand            = "0.8"
rand_chacha     = "0.3"
# Deterministic floating-point math for the thermal/battery models (PV-12.3,
# CLAIM-38.4/38.5): `libm` is a pure-Rust implementation, so results do not
# depend on the platform libm/libc.
libm            = "0.2"
toml            = "0.8"
hex             = "0.4"
wat             = "1"
arc-swap        = "1"
ciborium        = "0.2"
# The scenario runner executes adversarial scenarios against the real gateway
# stores (Stage-16 ledger, security-event log, boot reconciliation).  This was
# a dev-dependency while scenarios were unit-test-only (task 39 promotes the
# runner and scenario registry to production code).
tirbase-gateway = { workspace = true }
