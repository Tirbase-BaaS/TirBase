[package]
name = "tirbase-sim"
version = "0.1.0"
edition = "2021"
description = "Seeded deterministic adversary simulator for TirBase"
license = "MIT"

[dependencies]
tirbase-types   = { workspace = true }
tirbase-core    = { workspace = true }
tirbase-guard   = { workspace = true }
tirbase-drivers = { workspace = true }
automerge       = { version = "0.11.0", default-features = false }
rusqlite        = { version = "0.40", features = ["bundled"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
wat             = "1"

[dev-dependencies]
wat = "1"
arc-swap = "1"
tirbase-gateway = { workspace = true }
