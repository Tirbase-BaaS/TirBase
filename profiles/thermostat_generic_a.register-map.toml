# CC-03 generic thermostat profile A (original layout).
# Inputs 0–2: current temperature, alarm, fault.
# Holding registers 0–2: setpoint (FC 06), mode, fan. Unit 1.
device_class = "generic_thermostat_a"

[[register]]
name = "current_temperature"
register = 0
function = 4
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = false
quantity = 1

[[register]]
name = "alarm"
register = 1
function = 4
data_type = "u16"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = false
quantity = 1

[[register]]
name = "fault"
register = 2
function = 4
data_type = "u16"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = false
quantity = 1

[[register]]
name = "setpoint"
register = 0
function = 6
data_type = "i16"
scale_mantissa = 1
scale_exponent = -1
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = true
quantity = 1

[[register]]
name = "mode"
register = 1
function = 6
data_type = "u16"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = true
quantity = 1

[[register]]
name = "fan"
register = 2
function = 6
data_type = "u16"
scale_mantissa = 1
scale_exponent = 0
offset_mantissa = 0
offset_exponent = 0
word_order = "big_endian"
unit_id = 1
writable = true
quantity = 1
