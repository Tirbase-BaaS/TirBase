[package]
name = "tirbase-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "TirBase — offline-first, local-first BaaS core library (Rust)"
license = "MIT"

# ─── Feature flags ─────────────────────────────────────────────────────────────
# `native` and `wasm` are mutually exclusive build targets.
# `native` is the default (Cloud Ledger and desktop/server builds).
# `wasm`   is used when compiling to wasm32-unknown-unknown for the TypeScript SDK.

[features]
default = ["native"]
native  = ["dep:rusqlite", "rusqlite?/bundled", "dep:wasmtime"]
wasm    = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:wasm3"]

# ─── Shared dependencies (both targets) ────────────────────────────────────────
[dependencies]
# CRDT engine — Automerge 3.0 semantics
automerge        = { version = "0.5.10", default-features = false }

# Capability tokens — offline-verifiable Biscuit tokens
biscuit-auth     = "6.0.0"

# Ed25519 identity (DIDs, signing, verification)
ed25519-dalek    = { version = "3.0.0", features = ["rand_core"] }

# P2P networking
libp2p           = { version = "0.56.0", features = ["mdns", "noise", "tcp", "tokio", "gossipsub", "identify", "ping"] }

# Noise protocol session cryptography (IK pattern)
snow             = { version = "0.10.0", features = ["default-resolver"] }

# Error handling
thiserror        = "2.0.20"

# Property-based testing (dev + prod, used in test modules)
proptest         = "1.11.0"

# UUID v7 for IncidentContextObject IDs
uuid             = { version = "1.26.0", features = ["v4", "v7"] }

# Zstd compression for DAG node payloads
zstd             = "0.13.3"

# SHA-256 for DeltaId and SchemaIdentifierHash
sha2             = "0.11.0"

# Static compile-time assertions (API surface parity check)
static_assertions = "1.1.0"

# LRU cache for 0-RTT session resumption (capped at 1024 entries)
lru              = "0.18.3"

# Async runtime
tokio            = { version = "1.53.1", features = ["full"] }

# Async traits
async-trait      = "0.1.88"

# Serialisation
serde            = { version = "1.0.219", features = ["derive"] }
serde_json       = "1.0.140"

# Hex encoding for DID display
hex              = "0.4.3"

# Random number generation (for Ed25519 keypair)
rand             = "0.8.5"

# ─── Native-only dependencies ──────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite  = { version = "0.40.2", optional = true }
wasmtime  = { version = "48.0.1", optional = true }

# ─── WASM-only dependencies ────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys       = { version = "0.3.104", optional = true }
web-sys      = { version = "0.3.104", optional = true, features = [
    "Window",
    "Navigator",
    "console",
] }
# wasm3 — minimal WASM interpreter for WASM-in-WASM migration sandbox
wasm3        = { version = "0.3.1", optional = true }

# ─── Dev dependencies ──────────────────────────────────────────────────────────
[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }

# ─── Build profile ─────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
