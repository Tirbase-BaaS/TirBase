[package]
name = "tirbase-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "TirBase — offline-first, local-first BaaS core library (Rust)"
license = "MIT"

# ─── Feature flags ─────────────────────────────────────────────────────────────
# `native` and `wasm` are mutually exclusive build targets.
# `native` is the default (Cloud Ledger and desktop/server builds).
# `wasm`   is used when compiling to wasm32-unknown-unknown for the TypeScript SDK.

[features]
default = ["native"]
native  = [
    "dep:rusqlite",
    "rusqlite?/bundled",
    "dep:wasmtime",
    "dep:zstd",
    "dep:libp2p",
    "dep:snow",
    "dep:biscuit-auth",
    "dep:rand",
]
wasm    = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    # wasm3 is intentionally deferred: the C FFI cannot cross-compile to
    # wasm32-unknown-unknown with a standard Rust toolchain. Task 8 will
    # implement the WASM-in-WASM sandbox using a pure-Rust WASM interpreter
    # or an emcc-compiled wasm3 build.
]

# ─── Shared dependencies (both targets) ────────────────────────────────────────
[dependencies]
# CRDT engine — Automerge 3.0 semantics
automerge        = { version = "0.5.10", default-features = false }

# Ed25519 identity (DIDs, signing, verification)
ed25519-dalek    = { version = "3.0.0", features = ["rand_core"] }

# Cryptographically secure random bytes (for Ed25519 key generation)
# getrandom v0.4 is already a transitive dep via ed25519-dalek v3.
# The "wasm_js" feature is required when targeting wasm32-unknown-unknown.
getrandom        = { version = "0.4", features = ["wasm_js"] }

# Error handling
thiserror        = "2.0.20"

# UUID v7 for IncidentContextObject IDs
# The "js" feature is required on wasm32-unknown-unknown; harmless on native.
uuid             = { version = "1.26.0", features = ["v4", "v7", "js"] }

# SHA-256 for DeltaId and SchemaIdentifierHash
sha2             = "0.11.0"

# Base58-btc encoding for did:key derivation
bs58             = "0.5.0"

# Static compile-time assertions (API surface parity check)
static_assertions = "1.1.0"

# LRU cache for 0-RTT session resumption (capped at 1024 entries)
lru              = "0.18.3"

# Async runtime
tokio            = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }

# Serialisation
serde            = { version = "1.0.219", features = ["derive"] }
serde_json       = "1.0.140"

# Hex encoding for DID display
hex              = "0.4.3"

# Serde support for large byte arrays (e.g. Ed25519Signature = [u8; 64])
serde_bytes      = "0.11.19"

# Async traits
async-trait      = "0.1.88"

# PEG parser for schema definition language
pest             = "2.7"
pest_derive      = "2.7"

# ─── Native-only dependencies ──────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite     = { version = "0.40.2", optional = true }
wasmtime     = { version = "48.0.1", optional = true }

# Zstd compression for DAG node payloads (C FFI — native only)
zstd         = { version = "0.13.3", optional = true }

# P2P networking
libp2p       = { version = "0.56.0", optional = true, features = [
    "mdns", "noise", "tcp", "tokio", "gossipsub", "identify", "ping", "yamux", "macros",
] }

# Noise protocol session cryptography
snow         = { version = "0.10.0", optional = true, features = ["default-resolver"] }

# Capability tokens
biscuit-auth = { version = "6.0.0", optional = true }

# Random number generation
rand         = { version = "0.8.5", optional = true }

# ─── WASM-only dependencies ────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys       = { version = "0.3.104", optional = true }
web-sys      = { version = "0.3.104", optional = true, features = [
    "Window",
    "Navigator",
    "console",
] }
wasm-bindgen-futures = { version = "0.4", optional = true }

# ─── Dev dependencies ──────────────────────────────────────────────────────────
[dev-dependencies]
proptest = "1.11.0"
tokio    = { version = "1.53.1", features = ["full", "test-util"] }
# WAT (WebAssembly text format) parser used in sandbox tests
wat      = "1.229.0"
wasm-bindgen-test = "0.3"
