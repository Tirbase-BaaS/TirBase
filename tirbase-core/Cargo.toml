[package]
name = "tirbase-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "TirBase — offline-first, local-first BaaS core library (Rust)"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

# ─── Native-only helper binary for the Subphase 7.3 crash-recovery test ────────
#
# `crash_writer` opens a SQLite DB, commits a baseline row, begins a second
# transaction, inserts a partial row, then `std::process::abort()`s —
# simulating a hard process kill between BEGIN and COMMIT.  The integration
# test in `tests/crash_recovery.rs` spawns this binary and then reopens the DB
# through the production `LocalStore::open` path to verify no corrupted state
# survives.  Native-only: it links `rusqlite` (no WASM).
[[bin]]
name = "crash_writer"
path = "src/bin/crash_writer.rs"
required-features = ["native"]


# ─── Feature flags ─────────────────────────────────────────────────────────────
# `native` and `wasm` are mutually exclusive build targets.
# `native` is the default (Cloud Ledger and desktop/server builds).
# `wasm`   is used when compiling to wasm32-unknown-unknown for the TypeScript SDK.

# Fixture generator for the TypeScript SDK e2e suite (see
# `tirbase-sdk/src/__helpers__/real-core.ts`). All credentials it mints come
# from the production token builders, so it builds in a plain configuration.
[[example]]
name = "wasm_e2e_fixtures"

[features]
default = ["native"]
failpoints = ["fail/failpoints"]
# Test-only setup/inspection hooks (e.g. `CoreHandle::test_cce`).  Never enabled
# for release builds; CI enables it only for the integration-test suite.
test-hooks = []
# Cross-build parity probe (Property 1): native/WASM probes emit a
# deterministic state hash over the same canonical Delta sequence. Enabled only
# by CI/scripts; never for release artifacts.
parity-probe = []
native  = [
    "dep:rusqlite",
    "rusqlite?/bundled",
    "dep:wasmi",
    "dep:wasmparser",
    "dep:zstd",
    "dep:libp2p",
    "dep:snow",
    "dep:curve25519-dalek",
    "dep:biscuit-auth",
    "dep:rand",
    "dep:btleplug",
]
wasm    = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "dep:idb",
    "dep:wasmi",
    "dep:wasmparser",
    "dep:biscuit-auth",
    "biscuit-auth?/wasm",
]

# ─── Shared dependencies (both targets) ────────────────────────────────────────
[dependencies]
tirbase-types = { workspace = true }
# CRDT engine — `automerge` v0.11 Rust crate, implementing the Automerge 3.0
# document format with Hexane columnar storage.
automerge        = { version = "0.11.0", default-features = false }

# Ed25519 identity (DIDs, signing, verification)
ed25519-dalek    = { version = "3.0.0", features = ["rand_core"] }

# Cryptographically secure random bytes (for Ed25519 key generation)
# getrandom v0.4 is already a transitive dep via ed25519-dalek v3.
# The "wasm_js" feature is required when targeting wasm32-unknown-unknown.
getrandom        = { version = "0.4", features = ["wasm_js"] }

# Error handling
thiserror        = "2.0.20"

# UUID v7 for IncidentContextObject IDs
# The "js" feature is required on wasm32-unknown-unknown; harmless on native.
# The "serde" feature is required for IncidentId serialisation/deserialisation.
uuid             = { version = "1.26.0", features = ["v4", "v7", "js", "serde"] }

# SHA-256 for DeltaId and SchemaIdentifierHash
sha2             = "0.11.0"

# Base58-btc encoding for did:key derivation
bs58             = "0.5.0"

# Static compile-time assertions (API surface parity check)
static_assertions = "1.1.0"

# LRU cache for 0-RTT session resumption (capped at 1024 entries)
lru              = "0.18.3"

# Async runtime
tokio            = { version = "1.53.1", features = ["rt", "sync", "time", "macros", "io-util"] }

# Serialisation
serde            = { version = "1.0.219", features = ["derive"] }
serde_json       = "1.0.140"

# Hex encoding for DID display
hex              = "0.4.3"

# Serde support for large byte arrays (e.g. Ed25519Signature = [u8; 64])
serde_bytes      = "0.11.19"

# Async traits
async-trait      = "0.1.88"

# PEG parser for schema definition language
pest             = "2.7"
pest_derive      = "2.7"

# Capability tokens (pure-Rust; compiles on both native and wasm32 targets)
biscuit-auth = { version = "6.0.0", optional = true }
secrecy = "0.8"
# Zeroize-on-drop for key material (PV-3.7, CLAIM-6.1/6.2).  `alloc` enables
# zeroizing of `String` (hex-encoded seeds in the on-disk identity DTO).
zeroize = { version = "1.9", features = ["derive", "alloc"] }

# Migration sandbox (PV-8, CLAIM-29.x): wasmi is the sole WASM engine on all targets.
# wasmi 0.38 is already in the lock; wasmparser 0.254 validates DeterministicWasmProfile.
wasmi = { version = "0.38", optional = true, default-features = false, features = ["std"] }
wasmparser = { version = "0.254", optional = true }

# Failpoint injection for kill-at-every-step ledger tests (PV-5.4, 19.6).
# No-op in normal builds; enabled via `fail/failpoints` feature or tests.
fail = { workspace = true }

# ─── Native-only dependencies ──────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite     = { version = "0.40.2", optional = true }

# Zstd compression for DAG node payloads (C FFI — native only)
zstd         = { version = "0.13.3", optional = true }

# P2P networking
libp2p       = { version = "0.56.0", optional = true, features = [
    "mdns", "noise", "tcp", "tokio", "gossipsub", "identify", "ping", "yamux", "macros",
] }

# BLE transport bridge (native-only, optional)
btleplug      = { version = "0.11", optional = true, features = ["serde"] }

# Noise protocol session cryptography
snow         = { version = "0.10.0", optional = true, features = ["default-resolver"] }

# Curve25519 group ops (Ed25519→X25519 public-key conversion for Noise_IK key exchange)
curve25519-dalek = { version = "5.0", optional = true }

# Random number generation
rand         = { version = "0.8.5", optional = true }

# ─── WASM-only dependencies ────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys       = { version = "0.3.104", optional = true }
web-sys      = { version = "0.3.104", optional = true, features = [
    "Window",
    # `window.performance.now()` — the browser's monotonic clock, used by
    # `traits::SystemTimeSource` because `std::time::Instant` is unimplemented
    # on wasm32-unknown-unknown.
    "Performance",
    "Navigator",
    "console",
    # IndexedDB persistence for the WASM LocalStore (Subphase 6.3) — the
    # in-browser durable store backing `LocalStore::write` / `LocalStore::open`.
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbRequest",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbVersionChangeEvent",
    "DomException",
    "Event",
    "DomStringList",
] }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Async IndexedDB wrapper — provides ergonomic promise-based access to the
# browser's IndexedDB on the WASM build (Req 3.1, Subphase 6.3).
idb           = { version = "0.6", optional = true }

# Pure-Rust WASM interpreter for WASM-in-WASM sandbox (replaces deferred wasm3 dependency).
# wasmi 0.38 is the latest stable release that cross-compiles to wasm32-unknown-unknown.
wasmi        = { version = "0.38", optional = true, default-features = false, features = ["std"] }

# Force getrandom v0.2 (a biscuit-auth transitive dep) to enable the "js" feature
# so rand_core 0.6.x can generate randomness on wasm32-unknown-unknown.
getrandom02  = { package = "getrandom", version = "0.2", features = ["js"] }



# ─── Dev dependencies ──────────────────────────────────────────────────────────
#
# Dev dependencies are split by target because the WASM test suite
# (`scripts/wasm-test.sh`) compiles the same crate for wasm32-unknown-unknown,
# where several test-only crates cannot build at all:
#   * `proptest` → `wait-timeout` has no wasm32 backend;
#   * `criterion` / `iai-callgrind` are native benchmark harnesses (and the
#     benches themselves are native targets);
#   * `libc` is used to read peak RSS for the native memory gate;
#   * `tokio`'s `rt-multi-thread` / `test-util` / `net` features are rejected
#     on wasm (only `rt`, `macros`, `sync`, `time`, `io-util` are supported).
[dev-dependencies]
# WAT (WebAssembly text format) parser used in sandbox tests — pure Rust, so it
# builds on both targets.
wat = "1.229.0"
# The in-browser test harness itself (`#[wasm_bindgen_test]`).
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.11.0"
# Peak-RSS measurement for the task 24.5 memory gate (tests/memory_budget_gate.rs).
libc = "0.2"
tokio = { version = "1.53.1", features = [
    "rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "test-util",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.iai-callgrind]
version = "0.14"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Async in-browser tests: `#[tokio::test]` is unavailable on wasm, so the wasm
# tests drive futures through `wasm_bindgen_futures`, but the runtime pieces
# below are still needed for the sync primitives the library uses under test.
tokio = { version = "1.53.1", features = [
    "rt", "macros", "sync", "time", "io-util",
] }
# `proptest` (native-only) pulls `getrandom` 0.3 through `rand` 0.9, and
# getrandom 0.3 refuses to build for wasm32-unknown-unknown unless the `wasm_js`
# backend is enabled *and* `--cfg getrandom_backend="wasm_js"` is passed (see
# `scripts/wasm-test.sh`).  Declaring the feature here unifies it into the
# shared 0.3 build; native builds are untouched.
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }


[[bench]]
name = "core_bench"
harness = false

[[bench]]
name = "core_iai"
harness = false
