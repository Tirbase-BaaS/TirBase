# cross-rs pre-build hooks (PV-11.4).
#
# tirbase-core's `native` feature links the BLE bridge (btleplug → dbus), whose
# build script resolves libdbus-1 through pkg-config. cross's minimal images do
# not ship it, so each target installs the target-architecture development
# package before compiling.
#
# The packaging jobs also cross-build x86_64 so the binary links against a glibc
# old enough for Debian 11 (2.31) instead of the newer host glibc.

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64 && apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev:arm64 pkg-config",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture armhf && apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev:armhf pkg-config",
]
