openapi: 3.1.0
info:
  title: TirBase Gateway Admin API
  version: "1.1.0"
  description: |
    Administrative API for a TirBase edge gateway (PV-11.2).

    Authentication is kernel peer credentials on the local Unix socket, or
    mTLS plus a scoped Biscuit Bearer token on the remote listener. Every
    response carries a numeric `status`; errors carry a stable `code`.

    F-08 adds tenant-scoped cold-chain, POS and venue resources under
    `/admin/cold-chain`, `/admin/pos` and `/admin/venues`. Lists use
    `limit`/`cursor`; creates accept `idempotency_key`; mutations emit signed
    webhooks described under `webhooks`.
servers:
  - url: http://localhost
    description: Remote admin mTLS listener
security:
  - LocalPeerCredential: []
  - RemoteAdminCredential: []
tags:
  - name: enrollment
  - name: tokens
  - name: keys
  - name: policy
  - name: events
  - name: commands
  - name: mode
  - name: recovery
  - name: status
  - name: operations
  - name: cold-chain
  - name: pos
  - name: venues
paths:
  /admin/enroll:
    post:
      tags: [enrollment]
      operationId: enrollDevice
      summary: Enroll a device with a one-time nonce and signed bootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unconfigured' }
  /admin/mint:
    post:
      tags: [tokens]
      operationId: mintToken
      summary: Mint a scoped Biscuit token (max 86400 seconds)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MintRequest' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
