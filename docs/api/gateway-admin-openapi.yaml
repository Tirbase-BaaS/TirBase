        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerticalDeleteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unconfigured' }
  /admin/venues/{id}/gates:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [venues]
      operationId: listVenueGates
      summary: List child resources
      parameters:
      - { $ref: '#/components/parameters/Tenant' }
      parameters:
      - { $ref: '#/components/parameters/Limit' }
      parameters:
      - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerticalObjectList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unconfigured' }
    post:
      tags: [venues]
      operationId: createVenueGate
      summary: Create a child resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueGateCreate' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerticalObjectEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unconfigured' }
components:
  securitySchemes:
    LocalPeerCredential:
      type: apiKey
      in: header
      name: X-TirBase-Local-Peer-Credential
      description: Not client-supplied. The local Unix socket authenticates the peer with SO_PEERCRED/getpeereid and accepts only root or the gateway UID.
    RemoteAdminCredential:
      type: mutualTLS
      description: mTLS client certificate chaining to admin_remote_client_ca_path plus Authorization Bearer <hex> carrying a scoped Biscuit token.
  parameters:
    Tenant:
      in: query
      name: tenant
      required: false
      schema: { type: string, default: default, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
      description: Tenant scope. Defaults to default; objects are never visible across tenants.
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Page size. Values above 200 are clamped.
    Cursor:
      in: query
      name: cursor
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
      description: Offset returned as next_cursor by the previous page.
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$' }
      description: Resource id.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Remote caller without a valid scoped credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Credential present but insufficient for this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such object in this tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicting state such as a duplicate object id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unconfigured:
      description: Endpoint is wired but the required runtime state is absent in this process
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [status]
      properties:
        status: { type: integer }
        code: { type: string }
        error: { type: string }
        endpoint: { type: string }
    OkOutcome:
      type: object
      properties:
        status: { type: integer, const: 200 }
        endpoint: { type: string }
        outcome: { type: string }
    EnrollmentRequest:
      type: object
      required: [device_did, device_public_key, nonce, role, signature]
      properties:
        device_did: { type: string }
        device_public_key: { type: array, minItems: 32, maxItems: 32, items: { type: integer } }
        nonce: { type: array, minItems: 32, maxItems: 32, items: { type: integer } }
        role: { type: string, enum: [CommandIssuer, PolicyAuthority, UpdateSigner, RevocationManager, Auditor, TimeAnchor] }
        signature: { $ref: '#/components/schemas/DeviceSignature' }
    EnrollmentResponse:
      type: object
      properties:
        status: { type: integer, const: 200 }
        device_id: { type: string }
        epoch: { type: integer }
        token_hex: { type: string }
        token_ttl_secs: { type: integer }
    DeviceSignature:
      oneOf:
        - type: object
          required: [Ed25519]
          properties:
            Ed25519: { type: array, minItems: 64, maxItems: 64, items: { type: integer } }
        - type: object
          required: [P256]
          properties:
            P256: { type: array, items: { type: integer } }
    SignedOperation:
      type: object
      required: [context_string, payload_hash, signatures, created_est]
      properties:
        context_string: { type: string }
        payload_hash: { type: array, minItems: 32, maxItems: 32, items: { type: integer } }
        signatures:
          type: array
          items:
            type: object
            properties:
              signer_did: { type: string }
              role: { type: string }
              signature: { $ref: '#/components/schemas/DeviceSignature' }
        created_est: { type: integer }
        expires_est: { type: [integer, 'null'] }
    SignedEnvelope:
      type: object
      required: [operation, payload]
      properties:
        operation: { $ref: '#/components/schemas/SignedOperation' }
        payload: { type: object, additionalProperties: true }
    MintRequest:
      type: object
      required: [did, role, ttl_secs]
      properties:
        did: { type: string }
        role: { type: string, enum: [CommandIssuer, PolicyAuthority, UpdateSigner, RevocationManager, Auditor, TimeAnchor] }
        ttl_secs: { type: integer, minimum: 3600, maximum: 86400 }
        caveat: { type: string, enum: [disaster-alert] }
    PolicyRequest:
      type: object
      properties:
        bundle: { type: object, additionalProperties: true }
    CommandRequest:
      type: object
      required: [command]
      properties:
        command: { type: object, additionalProperties: true }
        biscuit_token_hex: { type: string }
        source_key: { type: string }
        now_est_secs: { type: integer }
    SimulationResult:
      type: object
      properties:
        simulated: { type: boolean, const: true }
        would_accept: { type: boolean }
        code: { type: string }
        detail: { type: string }
    ChallengeRequest:
      type: object
      required: [param]
      properties:
        target_id: { type: string }
        target: { type: string }
        param: { type: string }
        issuer_did: { type: string }
        nonce_hex: { type: string }
    ChallengeResult:
      type: object
      properties:
        status: { type: integer }
        outcome: { type: string }
        nonce_hex: { type: string }
        one_time_use: { type: boolean }
    ModeResult:
      type: object
      properties:
        status: { type: integer }
        mode: { type: string, enum: [Starting, Normal, Degraded, Restricted, Lockdown] }
        allows_commands: { type: boolean }
        allows_mesh_sync: { type: boolean }
        allows_log_export: { type: boolean }
        lockdown_persisted: { type: boolean }
    IssuerStatus:
      type: object
      properties:
        status: { type: integer }
        issuer_did: { type: string }
        self_query: { type: boolean }
        privileged: { type: boolean }
        anti_replay: { type: array, items: { type: object, additionalProperties: true } }
        rate_limit: { type: [object, 'null'], additionalProperties: true }
        leases: { type: array, items: { type: object, additionalProperties: true } }
    EventList:
      type: object
      properties:
        status: { type: integer }
        window_start_est: { type: integer }
        window_end_est: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        events: { type: array, items: { type: object, additionalProperties: true } }
    RolloutStatus:
      type: object
      properties:
        status: { type: integer }
        gateway_version: { type: string }
        node_mode: { type: string }
        profile_installed: { type: boolean }
        profile_id: { type: [string, 'null'] }
        profile_version: { type: [integer, 'null'] }
        device_class: { type: [string, 'null'] }
        self_update: { type: string, const: BLOCKED_PENDING_RFC_TUF }
    VerticalObject:
      type: object
      required: [id, vertical, kind, tenant, revision, created_est, updated_est, data]
      properties:
        id: { type: string }
        vertical: { type: string, enum: [cold-chain, pos, venues] }
        kind: { type: string, enum: [sites, readings, orders, lines, venues, gates] }
        tenant: { type: string }
        parent_id: { type: [string, 'null'] }
        revision: { type: integer, minimum: 1 }
        created_est: { type: integer }
        updated_est: { type: integer }
        data: { type: object, additionalProperties: true }
    VerticalObjectEnvelope:
      type: object
      required: [status, object]
      properties:
        status: { type: integer }
        idempotent_replay: { type: boolean }
        object: { $ref: '#/components/schemas/VerticalObject' }
    VerticalObjectList:
      type: object
      required: [status, vertical, kind, tenant, items, total]
      properties:
        status: { type: integer, const: 200 }
        vertical: { type: string }
        kind: { type: string }
        tenant: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/VerticalObject' } }
        total: { type: integer, minimum: 0 }
        next_cursor: { type: [string, 'null'] }
    VerticalDeleteResult:
      type: object
      required: [status, deleted, id]
      properties:
        status: { type: integer, const: 200 }
        deleted: { type: boolean, const: true }
        id: { type: string }
    VerticalWriteBase:
      type: object
      properties:
        tenant: { type: string, default: default }
        idempotency_key: { type: string, maxLength: 128 }
        id: { type: string, maxLength: 64 }
    ColdChainSiteCreate:
      allOf:
        - $ref: '#/components/schemas/VerticalWriteBase'
        - type: object
          required: [name]
          properties:
            name: { type: string, maxLength: 128 }
      examples:
        - { tenant: acme, name: Cold Room 1, idempotency_key: site-1 }
    ColdChainReadingCreate:
      allOf:
        - $ref: '#/components/schemas/VerticalWriteBase'
        - type: object
          required: [celsius_milli]
          properties:
            celsius_milli: { type: integer }
            recorded_est: { type: integer }
      examples:
        - { celsius_milli: -18500, idempotency_key: reading-1 }
    PosOrderCreate:
      allOf:
        - $ref: '#/components/schemas/VerticalWriteBase'
        - type: object
          required: [currency, total_minor]
          properties:
            currency: { type: string, pattern: '^[A-Za-z]{3}$' }
            total_minor: { type: integer, minimum: 0 }
            status: { type: string, enum: [open, paid, refunded, void] }
      examples:
        - { tenant: acme, currency: EUR, total_minor: 1250, idempotency_key: order-1 }
    PosLineCreate:
      allOf:
        - $ref: '#/components/schemas/VerticalWriteBase'
        - type: object
          required: [sku, quantity, unit_price_minor]
          properties:
            sku: { type: string, maxLength: 128 }
            quantity: { type: integer, minimum: 1 }
            unit_price_minor: { type: integer, minimum: 0 }
      examples:
        - { sku: SKU-1, quantity: 2, unit_price_minor: 625 }
    VenueCreate:
      allOf:
        - $ref: '#/components/schemas/VerticalWriteBase'
        - type: object
          required: [name]
          properties:
            name: { type: string, maxLength: 128 }
            capacity: { type: integer, minimum: 0 }
      examples:
        - { tenant: acme, name: North Stand }
    VenueGateCreate:
      allOf:
        - $ref: '#/components/schemas/VerticalWriteBase'
        - type: object
          required: [name]
          properties:
            name: { type: string, maxLength: 128 }
            opens_at_est: { type: integer }
            closes_at_est: { type: integer }
      examples:
        - { name: Gate A }
    VerticalWebhookEvent:
      type: object
      required: [type, created_est, data]
      properties:
        type: { type: string }
        created_est: { type: integer }
        data: { $ref: '#/components/schemas/VerticalObject' }
webhooks:
  verticalChange:
    post:
      summary: Signed vertical resource change
      description: |
        Delivered for every vertical create, patch and delete. The signature is
        HMAC-SHA256 over the UTF-8 string `<timestamp>.<body>`, hex encoded and
        sent as `X-TirBase-Signature: sha256=<hex>`. Deliveries also carry
        `X-TirBase-Delivery` and `X-TirBase-Timestamp`; receivers must reject
        timestamps older than 300 seconds and must de-duplicate the delivery id.
        Failed deliveries are retried with exponential backoff.
      parameters:
        - { in: header, name: X-TirBase-Delivery, required: true, schema: { type: string } }
        - { in: header, name: X-TirBase-Timestamp, required: true, schema: { type: integer } }
        - { in: header, name: X-TirBase-Signature, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerticalWebhookEvent' }
      responses:
        '204': { description: Delivered }
