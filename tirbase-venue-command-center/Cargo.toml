[package]
name = "tirbase-venue-command-center"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
publish = false
description = "AGPL venue command center backend: venue map, incident workflow, approved lockdown and override controls, drill isolation, after-action reports and role-aware attribution (ST-11)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tirbase-core = { workspace = true }
tirbase-venue = { workspace = true }
tirbase-venue-capacity = { workspace = true }
tirbase-venue-lockdown = { workspace = true }
tirbase-venue-ticket = { workspace = true }

[[bin]]
name = "venue-command-center"
path = "src/main.rs"
